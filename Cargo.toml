[package]
name = "openshell-annotate"
version = "0.1.0-rc.2"
edition = "2021"
rust-version = "1.94"
description = "Policy-as-code for OpenShell: scan @openshell source directives and generate/validate policy.yaml"
license = "Apache-2.0"
publish = false
repository = "https://github.com/ilanh/openshell-annotate"
authors = ["Ilan Harel"]

[dependencies]
# Pinned to the OpenShell v0.1.6 tag; Cargo.lock records the exact commit.
openshell-policy-schema = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.6" }
# Same tag. Schema parsing accepts policies the gateway later rejects; this crate is that validator.
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.6" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
miette = "7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# AST-based call-site lint (replaces the regex heuristics; the regex engine stays available as `[lint] engine = "regex"`).
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
# Same YAML implementation OpenShell uses, for reading trusted provider-profile files.
serde_yml = { package = "noyalib", version = "0.0.53", default-features = false, features = ["std", "compat-serde-yaml"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
