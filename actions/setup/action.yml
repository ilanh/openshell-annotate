name: openshell-annotate setup
description: Install a pinned openshell-annotate release (or build from source) and add it to PATH with caching.
branding:
  icon: package
  color: blue

inputs:
  version:
    description: >
      Release tag to install (e.g. v0.1.0-rc.2), `latest`, or `source` to build from the checked-out
      repository with cargo (Rust 1.94+ required; for this repo's CI only).
    required: false
    default: v0.1.0-rc.2
  install-dir:
    description: Directory for the openshell-annotate binary (added to PATH).
    required: false
    default: ""
  verify-attestation:
    description: Run `gh attestation verify` after download (needs GitHub CLI + contents:read).
    required: false
    default: "false"
  cache:
    description: Cache the installed binary between runs.
    required: false
    default: "true"

outputs:
  version:
    description: Installed openshell-annotate version string (from `openshell-annotate --version`).
    value: ${{ steps.meta.outputs.version }}
  install-dir:
    description: Directory containing the `openshell-annotate` binary.
    value: ${{ steps.meta.outputs.install-dir }}

runs:
  using: composite
  steps:
    - name: Resolve install directory
      id: dir
      shell: bash
      run: |
        if [ -n "${{ inputs.install-dir }}" ]; then
          dir="${{ inputs.install-dir }}"
        else
          dir="${RUNNER_TOOL_CACHE}/openshell-annotate"
        fi
        mkdir -p "$dir"
        echo "dir=$dir" >>"$GITHUB_OUTPUT"

    - name: Restore cache
      if: inputs.cache == 'true' && inputs.version != 'source'
      id: cache
      uses: actions/cache@684422466c4ff5064819fbae0ca35530fd955c5 # v4.3.0
      with:
        path: ${{ steps.dir.outputs.dir }}/openshell-annotate
        key: openshell-annotate-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install from release
      if: inputs.version != 'source' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        INSTALL_DIR: ${{ steps.dir.outputs.dir }}
        OPENSHELL_ANNOTATE_VERSION: ${{ inputs.version }}
        VERIFY: ${{ inputs.verify-attestation }}
      run: |
        set -euo pipefail
        install_sh="${{ github.action_path }}/../../install.sh"
        if [ ! -f "$install_sh" ]; then
          ref="${GITHUB_ACTION_REPOSITORY#*/}"
          ref_repo="ilanh/openshell-annotate"
          tag="${GITHUB_ACTION_REF:-main}"
          curl -fsSL "https://raw.githubusercontent.com/${ref_repo}/${tag}/install.sh" -o "$install_sh"
        fi
        args=(--dir "$INSTALL_DIR")
        if [ -n "${OPENSHELL_ANNOTATE_VERSION}" ]; then
          args+=(--version "$OPENSHELL_ANNOTATE_VERSION")
        fi
        if [ "$VERIFY" = "true" ]; then
          args+=(--verify)
        fi
        sh "$install_sh" "${args[@]}"

    - name: Build from source
      if: inputs.version == 'source'
      shell: bash
      env:
        INSTALL_DIR: ${{ steps.dir.outputs.dir }}
      run: |
        set -euo pipefail
        if ! command -v cargo >/dev/null 2>&1; then
          rustup toolchain install 1.94 --profile minimal
          rustup default 1.94
        fi
        cargo build --release --locked
        install -m 0755 target/release/openshell-annotate "$INSTALL_DIR/openshell-annotate"

    - name: Add to PATH
      shell: bash
      run: echo "${{ steps.dir.outputs.dir }}" >>"$GITHUB_PATH"

    - name: Record version
      id: meta
      shell: bash
      run: |
        bin="${{ steps.dir.outputs.dir }}/openshell-annotate"
        ver="$("$bin" --version 2>/dev/null || true)"
        echo "version=$ver" >>"$GITHUB_OUTPUT"
        echo "install-dir=${{ steps.dir.outputs.dir }}" >>"$GITHUB_OUTPUT"
        echo "openshell-annotate $ver at $bin"
