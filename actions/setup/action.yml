name: openshell-annotate setup
description: Install a pinned openshell-annotate release (or build from source) and add it to PATH with caching.
branding:
  icon: package
  color: blue

inputs:
  version:
    description: >
      Release tag to install (e.g. v0.1.0-rc.3), `latest`, or `source` to build from the checked-out
      repository with cargo (Rust 1.94+ required; for this repo's CI only).
    required: false
    default: v0.1.0-rc.3
  install-dir:
    description: Directory for the openshell-annotate binary (added to PATH).
    required: false
    default: ""
  verify-attestation:
    description: Run `gh attestation verify` after download (needs GitHub CLI + contents:read).
    required: false
    default: "false"
  cache:
    description: Cache the installed binary between runs.
    required: false
    default: "true"

outputs:
  version:
    description: Installed openshell-annotate version string (from `openshell-annotate --version`).
    value: ${{ steps.meta.outputs.version }}
  install-dir:
    description: Directory containing the `openshell-annotate` binary.
    value: ${{ steps.meta.outputs.install-dir }}

runs:
  using: composite
  steps:
    - name: Resolve install directory
      id: dir
      shell: bash
      env:
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
      run: bash "${{ github.action_path }}/../lib/setup.sh" dir

    - name: Restore cache
      if: inputs.cache == 'true' && inputs.version != 'source'
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
      with:
        path: ${{ steps.dir.outputs.dir }}/openshell-annotate
        key: openshell-annotate-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install from release
      if: inputs.version != 'source' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        INSTALL_DIR: ${{ steps.dir.outputs.dir }}
        OPENSHELL_ANNOTATE_VERSION: ${{ inputs.version }}
        VERIFY: ${{ inputs.verify-attestation }}
      run: bash "${{ github.action_path }}/../lib/setup.sh" install

    - name: Build from source
      if: inputs.version == 'source'
      shell: bash
      env:
        INSTALL_DIR: ${{ steps.dir.outputs.dir }}
      run: bash "${{ github.action_path }}/../lib/setup.sh" build

    - name: Add to PATH and record version
      id: meta
      shell: bash
      env:
        INSTALL_DIR: ${{ steps.dir.outputs.dir }}
      run: bash "${{ github.action_path }}/../lib/setup.sh" finish
