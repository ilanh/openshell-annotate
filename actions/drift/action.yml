name: openshell-annotate drift
description: Fail when the committed policy no longer matches @openshell directives in the tree.
branding:
  icon: alert-octagon
  color: red

inputs:
  root:
    description: Repository root passed to openshell-annotate (`--root`).
    required: false
    default: .
  policy:
    description: Committed policy.yaml (`--policy`).
    required: true
  providers:
    description: Optional committed providers JSON (`--providers`).
    required: false
    default: ""
  profiles-dir:
    description: Provider profiles directory (`--profiles-dir`), when not set in config.
    required: false
    default: ""
  strict:
    description: Treat unmanaged committed sections as drift (`--strict`).
    required: false
    default: "false"
  paths:
    description: Space-separated paths to scan (default entire root).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run drift
      id: run
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        POLICY: ${{ inputs.policy }}
        PROVIDERS: ${{ inputs.providers }}
        PROFILES_DIR: ${{ inputs.profiles-dir }}
        STRICT: ${{ inputs.strict }}
        PATHS: ${{ inputs.paths }}
      run: bash "${{ github.action_path }}/../lib/drift.sh"
