name: openshell-annotate lint
description: Lint directives and call sites; surface findings as workflow annotations and a job summary.
branding:
  icon: check-circle
  color: yellow

inputs:
  root:
    description: Repository root (`--root`).
    required: false
    default: .
  policy:
    description: Policy file to sanity-check (`--policy`); leave empty to skip policy checks.
    required: false
    default: ""
  paths:
    description: Space-separated paths to lint (default entire root).
    required: false
    default: ""
  failure-threshold:
    description: When to fail the step — `error` (default), `warning` (also fail on warnings), or `never`.
    required: false
    default: error

runs:
  using: composite
  steps:
    - name: Run lint
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        POLICY: ${{ inputs.policy }}
        PATHS: ${{ inputs.paths }}
        THRESHOLD: ${{ inputs.failure-threshold }}
      run: bash "${{ github.action_path }}/../lib/lint.sh"
