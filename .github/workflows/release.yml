name: Release

# Publishing runs only for a pushed version tag (vX.Y.Z or vX.Y.Z-rc.N / -pre.N, the latter two as prereleases).
# Pull requests that touch the release machinery run the same builds as a dry run: nothing is attested, pushed or published.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/package.sh"
      - "scripts/smoke.sh"
      - "Dockerfile.release"
      - "install.sh"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$REF_TYPE" != tag ]; then
            echo "dry run (not a tag): building $cargo_version, nothing will be published"
            { echo "version=$cargo_version"; echo "tag=none"; echo "prerelease=false"; echo "publish=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
          fi
          version="${tag#v}"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $cargo_version (run scripts/release.sh $version and merge it first)"; exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          if [ "$prerelease" = false ] && ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::stable release tags must point at a commit on main"; exit 1
          fi
          { echo "version=$version"; echo "tag=$tag"; echo "prerelease=$prerelease"; echo "publish=true"; } >> "$GITHUB_OUTPUT"
          echo "releasing $tag (prerelease=$prerelease)"

  build:
    name: build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          # both macOS targets are built on the arm64 runner (the x86_64 one is cross-compiled; clang handles the C grammars)
          - { target: x86_64-apple-darwin, os: macos-15, musl: false }
          - { target: aarch64-apple-darwin, os: macos-15, musl: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.94 --profile minimal --target "$TARGET"
          rustup default 1.94
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          MUSL: ${{ matrix.musl }}
        run: |
          # reproducible-ish: no absolute paths in the binary; C grammars compile against musl headers on musl targets
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo"
          export CFLAGS="-ffile-prefix-map=$HOME/.cargo=/cargo"
          if [ "$MUSL" = true ]; then export "CC_${TARGET//-/_}=musl-gcc"; fi
          cargo build --release --locked --target "$TARGET"
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/openshell-annotate"
          scripts/smoke.sh "$bin"
          if [ "$RUNNER_OS" = Linux ]; then
            file "$bin"
            ldd "$bin" 2>&1 | grep -qE 'not a dynamic executable|statically linked' || { echo "::error::binary is not static"; exit 1; }
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/openshell-annotate
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: sbom
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: openshell-annotate-${{ needs.plan.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: openshell-annotate-${{ needs.plan.outputs.version }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  docker:
    name: docker image
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/openshell-annotate (only on a tag)
      id-token: write # keyless signing identity for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the image contains the very binaries that are attached to the release (static musl builds), not a second build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-x86_64-unknown-linux-musl
          path: dist-docker/linux-amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-aarch64-unknown-linux-musl
          path: dist-docker/linux-arm64
      - run: chmod +x dist-docker/*/openshell-annotate
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 image and smoke test it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: openshell-annotate:smoke
      - run: docker run --rm openshell-annotate:smoke --version
      - name: Log in to ghcr.io
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.plan.outputs.publish == 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ needs.plan.outputs.version }}
            ${{ needs.plan.outputs.prerelease == 'false' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.title=openshell-annotate
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Attest image provenance
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: github release
    needs: [plan, build, sbom, docker]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless signing identity for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist
      - name: Package and checksum
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          for d in artifacts/bin-*; do
            target="${d#artifacts/bin-}"
            scripts/package.sh "$VERSION" "$target" "$d/openshell-annotate" dist
          done
          cd dist
          sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          cat > notes-head.md <<NOTES
          Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh | sh -s -- --version ${TAG}\`
          Container: \`docker pull ${IMAGE}:${VERSION}\`
          Verify: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\` (see docs/RELEASING.md). Checksums are in SHA256SUMS.
          NOTES
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes --notes-file notes-head.md "${flags[@]}"
