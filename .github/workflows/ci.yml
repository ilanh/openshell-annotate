name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets .github/workflows/openshell-next.yml run CI on the commits it pushes (GITHUB_TOKEN pushes trigger nothing else).
  # Those runs report back as commit statuses (job `dispatch-status` below).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.94 --profile minimal --component rustfmt,clippy && rustup default 1.94
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked
      - name: validate example and golden policies
        run: cargo test --locked --test gateway_policies
      - name: docs are up to date
        run: scripts/gen-docs.sh --check
      - name: GitHub Actions docs match action.yml
        run: scripts/gen-actions-docs.sh --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit
        run: cargo install cargo-audit --locked && cargo audit

  # A dispatched run's check runs do not show on the pull request (#82 for openshell-next): its rollup stays empty, and the
  # `pull_request` runs that the GITHUB_TOKEN push creates wait for "Approve workflows to run" (GitHub, 2026-06-11).
  # Publish the result as commit statuses instead. Named `CI (dispatched) / <job>`, so they never stand in for the
  # required `check` / `audit` checks.
  dispatch-status:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [check, audit]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish the result as commit statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK: ${{ needs.check.result }}
          AUDIT: ${{ needs.audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          post() {
            local state
            case "$2" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" -f context="CI (dispatched) / $1" -f target_url="$RUN_URL" \
              -f description="$1: $2 (workflow_dispatch run on $GITHUB_REF_NAME)" >/dev/null
            echo "CI (dispatched) / $1: $state" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          post check "$CHECK"
          post audit "$AUDIT"
