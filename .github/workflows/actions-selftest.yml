name: Actions self-test

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "actions/**"
      - ".github/workflows/actions-selftest.yml"
      - "install.sh"
  pull_request:
    paths:
      - "actions/**"
      - ".github/workflows/actions-selftest.yml"
      - "install.sh"
      - "docs/GITHUB_ACTIONS.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: actions-selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-setup-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Install from release
        uses: ./actions/setup
        with:
          version: v0.1.0-rc.2
          cache: "true"
      - name: Print version
        run: openshell-annotate --version

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Check (setup + drift + lint)
        uses: ./actions/check
        with:
          version: source
          root: examples/polyglot
          policy: openshell/policy.yaml
          providers: openshell/providers.json
          failure-threshold: warning
      - name: Generate
        id: gen
        uses: ./actions/generate
        with:
          root: examples/polyglot
          policy-out: openshell/ci-policy.yaml
          providers-out: openshell/ci-providers.json
      - name: Assert generate outputs
        run: test -f "${{ steps.gen.outputs.policy-path }}"
      - name: diff-logs (expect findings)
        uses: ./actions/diff-logs
        continue-on-error: true
        id: difflogs
        with:
          root: tests/fixtures/sample
          logs: ${{ github.workspace }}/tests/fixtures/logs/shorthand.log
      - name: diff-logs should report missing directives
        run: test "${{ steps.difflogs.outcome }}" = failure

  drift-failure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: ./actions/setup
        with:
          version: source
          cache: "false"
      - name: Copy example and tamper policy
        id: prep
        run: |
          dir="$RUNNER_TEMP/polyglot-drift"
          cp -a examples/polyglot "$dir"
          sed -i 's/enforcement: enforce/enforcement: audit/' "$dir/openshell/policy.yaml"
          echo "dir=$dir" >>"$GITHUB_OUTPUT"
      - name: Drift must fail
        uses: ./actions/drift
        continue-on-error: true
        id: drift
        with:
          root: ${{ steps.prep.outputs.dir }}
          policy: openshell/policy.yaml
      - name: Assert drift failed
        run: test "${{ steps.drift.outcome }}" = failure

  # Regression test for #65: run `check` the way an external consumer does. This repository is checked out
  # into a subdirectory, so the workspace root is a separate "consumer" repo with no actions/ directory.
  # A relative `uses: ./actions/...` inside a composite resolves against that workspace and would fail here.
  consumer-check:
    name: consumer check (${{ matrix.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [source, v0.1.0-rc.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          path: annotate-src
      - name: Create consumer fixture repo
        run: |
          cp -a annotate-src/examples/polyglot consumer
          test ! -e actions
      - name: Check (as a consumer)
        id: check
        uses: ./annotate-src/actions/check
        with:
          version: ${{ matrix.version }}
          root: consumer
          policy: openshell/policy.yaml
          providers: openshell/providers.json
          failure-threshold: warning
      - name: Assert version output
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          echo "installed: $VERSION"
          test -n "$VERSION"
