    # cached blobs (src/cpp/cache.cpp:2)
    - "/workspace/blobs"
    # downloaded wheels (src/py/wheels.py:12)
    - "/workspace/cache"
    # module list cache (src/go/main.go:12)
    - "/workspace/data"
process:
